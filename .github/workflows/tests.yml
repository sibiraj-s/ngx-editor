name: Tests

env:
  NODE_VERSION: 24

on:
  push:
    branches: master
  pull_request:
    branches: master

jobs:
  test:
    name: Unit tests
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Using node v-${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{env.NODE_VERSION}}
          cache: npm

      - name: NPM Install
        run: npm ci

      - name: Build
        run: npm run build:lib
        env:
          NODE_ENV: production

      - name: Test
        run: npm run test
