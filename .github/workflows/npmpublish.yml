name: NPM Publish

env:
  NODE_VERSION: 24

on:
  release:
    types: [created]

jobs:
  test-lib:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{env.NODE_VERSION}}
          cache: npm

      - run: npm ci

      - run: npm run build:lib
      - run: npm run test:lib

  publish-npm:
    needs: test-lib
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{env.NODE_VERSION}}
          registry-url: https://registry.npmjs.org/
          cache: npm

      # staged publishing requires npm 11.15.0 or later
      - run: npm install -g npm@^11.15.0

      - run: npm ci
      - run: npm run build:lib

      # the release waits on npmjs.com until a maintainer approves it with 2FA
      - run: npm stage publish dist/ngx-editor/ --tag ${{ github.event.release.prerelease && 'next' || 'latest' }}
